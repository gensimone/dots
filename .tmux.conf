# ==============================================================================
# GENERAL SETTINGS
# ==============================================================================

# Automatically renumber windows when any window is closed
set -g renumber-windows on

# Start window numbering at 1 instead of 0 to match keyboard layout order
set -g base-index 1

# Enable system clipboard integration
set -s set-clipboard on

# Increase scrollback history limit to 50,000 lines
set -g history-limit 50000

# Enable mouse support for selecting panes, scrolling, and resizing
set -g mouse on

# Use Vi keybindings in copy mode (e.g., page scrolling, navigation)
set-window-option -g mode-keys vi


# ==============================================================================
# COPY MODE BINDINGS (VI-STYLE)
# ==============================================================================

# Start visual text selection using 'v' in copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Toggle block selection mode using 'Ctrl+v' in copy mode
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy selected text to the system clipboard using 'y' (requires xclip)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'


# ==============================================================================
# CONFIGURATION MANAGEMENT
# ==============================================================================

# Reload tmux configuration file easily with 'Prefix + r'
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded..."


# ==============================================================================
# WINDOW & PANE MANAGEMENT
# ==============================================================================

# Unbind original 'n' keybinding (default: next window)
unbind n

# Split pane vertically (top/bottom) starting in the current working directory
bind n split-window -v -c "#{pane_current_path}"

# Split pane horizontally (left/right) starting in the current working directory
bind v split-window -h -c "#{pane_current_path}"

# Create a new window starting in the current working directory
bind c new-window -c "#{pane_current_path}"


# ==============================================================================
# VIM / TMUX SEAMLESS NAVIGATION (SMART PANE SWITCHING)
# ==============================================================================

# Variable check to determine if the active pane is running Vim/Neovim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

# Navigate between panes seamlessly using 'Ctrl + h/j/k/l' across Vim and Tmux
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }

# Navigation support for copy mode
bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' 'select-pane -R'


# ==============================================================================
# PANE RESIZING BINDINGS
# ==============================================================================

# Resize current pane by 3 cells using 'Alt + h/j/k/l' (passes keys through if in Vim)
bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'
